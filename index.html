<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>象屿盈信智能客服演示</title>
  <style>
    :root {
      --brand-red: #c91f25;
      --brand-red-dark: #9f151c;
      --blue: #2458a6;
      --teal: #0f8b75;
      --amber: #d98916;
      --ink: #1f2933;
      --muted: #667085;
      --line: #d8dee7;
      --paper: #ffffff;
      --soft: #f4f7fb;
      --wechat-bg: #ededed;
      --success-bg: #eaf7f4;
      --danger-bg: #fff1f1;
      --shadow: 0 18px 45px rgba(31, 41, 51, 0.14);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      color: var(--ink);
      overflow-x: hidden;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(244, 247, 251, 0.95)),
        #f2f5f8;
    }

    button {
      font: inherit;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(310px, 430px) minmax(390px, 1fr);
      gap: 26px;
      align-items: center;
      width: min(1180px, calc(100vw - 40px));
      margin: 0 auto;
      padding: 24px 0;
    }

    .panel {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(216, 222, 231, 0.9);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 22px;
    }

    .brand-line {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #eef1f5;
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .brand-logo::before {
      content: "";
      width: 23px;
      height: 34px;
      border-radius: 24px 4px 24px 4px;
      background: linear-gradient(145deg, #e43a40, var(--brand-red));
      transform: rotate(28deg) skewY(-12deg);
      box-shadow: 9px 7px 0 rgba(201, 31, 37, 0.18);
    }

    .brand-title {
      min-width: 0;
    }

    .brand-title strong {
      display: block;
      font-size: 22px;
      line-height: 1.25;
    }

    .brand-title span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .metric {
      border: 1px solid #e4e9f0;
      border-radius: 8px;
      padding: 13px 12px;
      background: #fbfcfe;
      min-height: 86px;
    }

    .metric b {
      display: block;
      font-size: 28px;
      line-height: 1;
      color: var(--brand-red-dark);
      margin-bottom: 8px;
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 16px 0 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .case-list {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    .case-button {
      width: 100%;
      border: 1px solid #e1e7ef;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 11px 12px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.18s ease, background 0.18s ease, transform 0.18s ease;
    }

    .case-button:hover,
    .case-button.is-active {
      border-color: rgba(201, 31, 37, 0.55);
      background: #fff7f7;
      transform: translateY(-1px);
    }

    .case-number {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: #eef3fb;
      color: var(--blue);
      font-weight: 700;
      font-size: 13px;
    }

    .case-button.is-active .case-number {
      background: var(--brand-red);
      color: #fff;
    }

    .case-text strong {
      display: block;
      font-size: 14px;
      line-height: 1.25;
    }

    .case-text span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
      line-height: 1.35;
    }

    .case-state {
      font-size: 12px;
      color: var(--muted);
    }

    .case-button.is-active .case-state {
      color: var(--brand-red-dark);
      font-weight: 700;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .control-button {
      border: 1px solid #d7dee8;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 11px 12px;
      cursor: pointer;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
    }

    .control-button.primary {
      border-color: var(--brand-red);
      background: var(--brand-red);
      color: #fff;
    }

    .button-icon {
      width: 16px;
      height: 16px;
      display: inline-block;
      position: relative;
      flex: 0 0 16px;
    }

    .icon-play::before {
      content: "";
      position: absolute;
      inset: 2px 2px 2px 5px;
      clip-path: polygon(0 0, 100% 50%, 0 100%);
      background: currentColor;
    }

    .icon-replay::before,
    .icon-replay::after {
      content: "";
      position: absolute;
    }

    .icon-replay::before {
      width: 12px;
      height: 12px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      top: 1px;
      left: 1px;
    }

    .icon-replay::after {
      width: 0;
      height: 0;
      border-left: 5px solid currentColor;
      border-top: 4px solid transparent;
      border-bottom: 4px solid transparent;
      top: 0;
      left: 1px;
      transform: rotate(-20deg);
    }

    .step-card {
      border: 1px solid #e3e9f1;
      border-radius: 8px;
      background: #fbfcfe;
      padding: 14px;
    }

    .step-label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 7px;
    }

    .step-title {
      font-weight: 700;
      margin-bottom: 8px;
    }

    .step-copy {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .phone-area {
      display: grid;
      place-items: center;
      min-width: 0;
    }

    .phone-shell {
      width: min(430px, 100%);
      max-width: 100%;
      background: #1d232b;
      border-radius: 28px;
      padding: 10px;
      box-shadow: 0 30px 70px rgba(31, 41, 51, 0.28);
      position: relative;
    }

    .phone-shell::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 102px;
      height: 19px;
      background: #1d232b;
      border-radius: 0 0 14px 14px;
      z-index: 3;
    }

    .phone {
      height: 790px;
      max-height: calc(100vh - 68px);
      min-height: 640px;
      background: var(--wechat-bg);
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .status-bar {
      height: 34px;
      background: #f7f7f7;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 18px;
      color: #4b5563;
      font-size: 13px;
      flex: 0 0 auto;
    }

    .status-icons {
      justify-self: end;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .signal {
      display: inline-flex;
      align-items: flex-end;
      gap: 2px;
      height: 11px;
    }

    .signal i {
      width: 3px;
      background: #4b5563;
      border-radius: 2px;
      display: block;
    }

    .signal i:nth-child(1) { height: 4px; }
    .signal i:nth-child(2) { height: 7px; }
    .signal i:nth-child(3) { height: 10px; }

    .battery {
      width: 23px;
      height: 12px;
      border: 1.6px solid #4b5563;
      border-radius: 3px;
      position: relative;
    }

    .battery::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 14px;
      height: 6px;
      background: #4b5563;
      border-radius: 1px;
    }

    .battery::after {
      content: "";
      position: absolute;
      right: -4px;
      top: 3px;
      width: 2px;
      height: 6px;
      background: #4b5563;
      border-radius: 0 2px 2px 0;
    }

    .wechat-head {
      height: 58px;
      flex: 0 0 auto;
      background: #f7f7f7;
      display: grid;
      grid-template-columns: 54px 1fr 54px;
      align-items: center;
      border-bottom: 1px solid #d7d7d7;
    }

    .back-icon,
    .person-icon {
      width: 54px;
      height: 58px;
      border: 0;
      background: transparent;
      color: #111827;
      display: grid;
      place-items: center;
      padding: 0;
    }

    .back-icon::before {
      content: "";
      width: 15px;
      height: 15px;
      border-left: 3px solid currentColor;
      border-bottom: 3px solid currentColor;
      transform: rotate(45deg);
      margin-left: 8px;
    }

    .person-icon::before,
    .person-icon::after {
      content: "";
      position: absolute;
      border: 2.5px solid currentColor;
    }

    .person-icon {
      position: relative;
    }

    .person-icon::before {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      top: 13px;
      left: 18px;
    }

    .person-icon::after {
      width: 27px;
      height: 15px;
      border-top: 0;
      border-radius: 0 0 18px 18px;
      left: 13px;
      top: 32px;
    }

    .wechat-title {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      line-height: 1;
    }

    .chat {
      position: relative;
      flex: 1 1 auto;
      overflow: hidden;
      background: var(--wechat-bg);
    }

    .chat-scroll {
      height: 100%;
      overflow-y: auto;
      padding: 20px 15px 18px;
      scroll-behavior: smooth;
    }

    .chat-scroll::-webkit-scrollbar {
      width: 0;
    }

    .date-line {
      text-align: center;
      color: #9ba1aa;
      font-size: 13px;
      margin: 0 0 18px;
    }

    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 12px;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .avatar {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid #e8edf3;
      display: grid;
      place-items: center;
      color: var(--brand-red);
      position: relative;
      overflow: hidden;
    }

    .avatar::before {
      content: "";
      width: 17px;
      height: 24px;
      border-radius: 18px 4px 18px 4px;
      background: linear-gradient(145deg, #e7484e, var(--brand-red));
      transform: rotate(28deg) skewY(-12deg);
    }

    .user-avatar {
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #dfe9f5;
      color: #2458a6;
      display: grid;
      place-items: center;
      font-weight: 700;
    }

    .bubble {
      max-width: calc(100% - 48px);
      background: #fff;
      border-radius: 8px;
      padding: 12px 13px;
      font-size: 14px;
      line-height: 1.7;
      box-shadow: 0 1px 0 rgba(31, 41, 51, 0.04);
      word-break: break-word;
    }

    .user .bubble {
      background: #b9ec92;
      color: #13220d;
    }

    .bubble strong {
      font-weight: 800;
    }

    .bubble p {
      margin: 0 0 10px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .keyword-list {
      display: grid;
      gap: 6px;
      margin: 11px 0 12px;
    }

    .keyword-line {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 7px;
      align-items: baseline;
      line-height: 1.5;
    }

    .keyword-line b {
      color: var(--blue);
      font-weight: 800;
      white-space: nowrap;
    }

    .action-stack {
      display: grid;
      gap: 8px;
      margin-top: 10px;
    }

    .action-card {
      border: 1px solid #e5ebf3;
      border-radius: 8px;
      background: #fff;
      display: grid;
      grid-template-columns: 36px 1fr 18px;
      gap: 10px;
      align-items: center;
      padding: 10px;
      min-height: 64px;
      cursor: pointer;
      text-align: left;
      color: inherit;
      position: relative;
    }

    .action-card:hover {
      border-color: rgba(36, 88, 166, 0.45);
    }

    .action-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: #eef4ff;
      display: grid;
      place-items: center;
      color: var(--blue);
      position: relative;
    }

    .action-icon.link::before,
    .action-icon.link::after {
      content: "";
      position: absolute;
      width: 13px;
      height: 7px;
      border: 2px solid currentColor;
      border-radius: 8px;
      transform: rotate(-38deg);
    }

    .action-icon.link::before {
      left: 8px;
      top: 12px;
    }

    .action-icon.link::after {
      right: 8px;
      bottom: 12px;
    }

    .action-icon.pin::before {
      content: "";
      width: 15px;
      height: 20px;
      background: currentColor;
      clip-path: path("M7.5 0C3.3 0 0 3.3 0 7.4c0 5.4 7.5 12.6 7.5 12.6S15 12.8 15 7.4C15 3.3 11.7 0 7.5 0Zm0 10.2A2.8 2.8 0 1 1 7.5 4.6a2.8 2.8 0 0 1 0 5.6Z");
    }

    .action-icon.file::before {
      content: "";
      width: 17px;
      height: 22px;
      border: 2px solid currentColor;
      border-radius: 3px;
      background: linear-gradient(currentColor, currentColor) 4px 8px / 9px 2px no-repeat,
        linear-gradient(currentColor, currentColor) 4px 13px / 9px 2px no-repeat;
    }

    .action-icon.money::before {
      content: "";
      width: 20px;
      height: 14px;
      border: 2px solid currentColor;
      border-radius: 4px;
      background: radial-gradient(circle, currentColor 0 2px, transparent 2.5px);
    }

    .action-icon.warn {
      background: #fff2e0;
      color: var(--amber);
    }

    .action-icon.warn::before {
      content: "!";
      font-weight: 800;
      font-size: 23px;
      line-height: 1;
    }

    .action-main strong {
      display: block;
      font-size: 14px;
      line-height: 1.25;
    }

    .action-main span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }

    .action-arrow {
      color: #8d96a3;
      font-size: 22px;
      line-height: 1;
    }

    .mini-panel {
      border: 1px solid #e4e9f0;
      border-radius: 8px;
      background: #fbfdff;
      padding: 10px;
      margin-top: 10px;
    }

    .mini-panel-title {
      font-weight: 800;
      font-size: 13px;
      color: var(--blue);
      margin-bottom: 7px;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .mini-item {
      background: #fff;
      border: 1px solid #e8edf3;
      border-radius: 8px;
      padding: 8px;
      min-height: 58px;
    }

    .mini-item span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 4px;
    }

    .mini-item b {
      font-size: 14px;
      color: var(--ink);
    }

    .handoff {
      border: 1px solid #f0c4c4;
      background: var(--danger-bg);
      color: #6d1f1f;
    }

    .handoff .handoff-head {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      margin-bottom: 8px;
      color: var(--brand-red-dark);
    }

    .handoff-icon {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid currentColor;
      display: inline-grid;
      place-items: center;
      flex: 0 0 22px;
    }

    .handoff-icon::before {
      content: "!";
      font-size: 14px;
      font-weight: 900;
      line-height: 1;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 9px;
    }

    .tag {
      border-radius: 8px;
      padding: 4px 7px;
      background: #eef3fb;
      color: var(--blue);
      font-size: 11px;
      font-weight: 700;
    }

    .tag.danger {
      background: #ffe3e3;
      color: var(--brand-red-dark);
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 46px;
    }

    .typing i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9ba1aa;
      animation: typing 0.9s infinite ease-in-out;
    }

    .typing i:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing i:nth-child(3) {
      animation-delay: 0.3s;
    }

    .bottom-menu {
      height: 74px;
      flex: 0 0 auto;
      background: #f8f8f8;
      border-top: 1px solid #dcdcdc;
      display: grid;
      grid-template-columns: 54px 1fr 1fr 1fr;
      align-items: stretch;
    }

    .keyboard {
      display: grid;
      place-items: center;
      border-right: 1px solid #dedede;
      position: relative;
    }

    .keyboard::before {
      content: "";
      width: 30px;
      height: 30px;
      border: 2.4px solid #111827;
      border-radius: 50%;
      background:
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 7px 8px / 8px 8px,
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 15px 8px / 8px 8px,
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 23px 8px / 8px 8px,
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 7px 16px / 8px 8px,
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 15px 16px / 8px 8px,
        radial-gradient(circle, #111827 0 2px, transparent 2.5px) 23px 16px / 8px 8px;
      background-repeat: no-repeat;
    }

    .menu-item {
      border: 0;
      border-right: 1px solid #dedede;
      background: transparent;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      padding: 0 10px;
      cursor: pointer;
      color: #111827;
      position: relative;
      min-width: 0;
    }

    .menu-item:last-child {
      border-right: 0;
    }

    .menu-item span:first-child {
      justify-self: center;
      font-size: 17px;
      font-weight: 700;
      white-space: nowrap;
    }

    .menu-item .menu-mark {
      color: #9aa1ab;
      font-size: 13px;
      margin-left: 3px;
    }

    .menu-item.is-active {
      color: var(--brand-red-dark);
      background: #fff5f5;
    }

    .menu-item.is-active::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      top: 0;
      height: 3px;
      background: var(--brand-red);
      border-radius: 0 0 3px 3px;
    }

    .tap-target.is-tapped {
      outline: 3px solid rgba(201, 31, 37, 0.32);
      box-shadow: 0 0 0 8px rgba(201, 31, 37, 0.12);
      animation: pulseTap 0.9s ease infinite;
      z-index: 4;
    }

    .tap-callout {
      position: fixed;
      z-index: 99;
      pointer-events: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #111827;
      color: #fff;
      border-radius: 8px;
      padding: 8px 10px;
      box-shadow: 0 14px 30px rgba(17, 24, 39, 0.22);
      font-size: 13px;
      font-weight: 700;
      animation: calloutIn 0.22s ease both;
      max-width: 230px;
    }

    .tap-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--brand-red);
      border: 3px solid #fff;
      flex: 0 0 14px;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 92px;
      transform: translateX(-50%);
      background: rgba(17, 24, 39, 0.92);
      color: #fff;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      z-index: 6;
      animation: toastIn 1.6s ease both;
      max-width: 80%;
      text-align: center;
    }

    @keyframes typing {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.45;
      }
      40% {
        transform: translateY(-4px);
        opacity: 1;
      }
    }

    @keyframes pulseTap {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-1px);
      }
    }

    @keyframes calloutIn {
      from {

      removeTyping();
      const row = document.createElement("div");

      row.innerHTML = `

      chatScroll.appendChild(row);
      bindActionCards(row);
      scrollBottom();

      chatScroll.appendChild(row);

        <div class="bubble handoff">

          <div class="tag-row">

          </div>
        </div>

      chatScroll.appendChild(row);
      scrollBottom();

      removeTyping();

      scrollBottom();

    function removeTyping() {
      const typing = chatScroll.querySelector(".typing-row");
      if (typing) typing.remove();
    }

    function scrollBottom() {
      chatScroll.scrollTop = chatScroll.scrollHeight;
      timers.push(setTimeout(() => {
        chatScroll.scrollTop = chatScroll.scrollHeight;
      }, 40));
    }

    function playScenario(index) {
      clearTimers();
      activeCase = index;
      renderCases();
      resetChat();
      const scenario = scenarios[index];
      setStep(scenario.title, scenario.intro);
      let elapsed = 600;

      scenario.events.forEach((event) => {
        const wait = event.delay ?? 900;
        timers.push(setTimeout(() => runEvent(event), elapsed));
        elapsed += wait + (event.type === "tap" ? 900 : 650);
      });

      if (autoPlay) {
        timers.push(setTimeout(() => {
          playScenario((index + 1) % scenarios.length);
        }, elapsed + 2300));
      }
    }

    function runEvent(event) {
      if (event.title || event.copy) {
        setStep(event.title || scenarios[activeCase].title, event.copy || scenarios[activeCase].intro);
      }

      if (event.type === "user") {
        appendUser(event.text);
        return;
      }

      if (event.type === "bot") {
        showTyping();
        timers.push(setTimeout(() => appendBot(event.html, true), 520));
        return;
      }

      if (event.type === "handoff") {
        showTyping();
        timers.push(setTimeout(() => appendHandoff(event), 520));
        return;
      }

      if (event.type === "tap") {
        highlightTarget(event.target, event.title || "点击操作");
      }
    }

    function setStep(title, copy) {
      stepTitle.textContent = title;
      stepCopy.textContent = copy;
    }

    function highlightTarget(target, label) {
      clearHighlights();
      if (target === "business") {
        document.querySelector('[data-target="business"]').classList.add("is-active");
      }
      const candidates = Array.from(document.querySelectorAll(`[data-target="${target}"]`));
      const element = candidates.reverse().find((candidate) => candidate.offsetParent !== null);
      if (!element) return;
      element.classList.add("is-tapped");
      showCallout(element, label);
      timers.push(setTimeout(clearHighlights, 1350));
      if (target === "bind") showToast("账户绑定成功");
      if (target === "network") showToast("正在打开网点查询");
    }

    function clearHighlights() {
      document.querySelectorAll(".is-tapped").forEach((element) => element.classList.remove("is-tapped"));
      document.querySelectorAll(".tap-callout").forEach((element) => element.remove());
    }

    function showCallout(element, label) {
      const rect = element.getBoundingClientRect();
      const callout = document.createElement("div");
      callout.className = "tap-callout";
      callout.innerHTML = `<span class="tap-dot" aria-hidden="true"></span><span>${escapeHtml(label)}</span>`;
      document.body.appendChild(callout);
      const width = Math.min(callout.offsetWidth, 230);
      const left = Math.min(Math.max(rect.left + rect.width / 2 - width / 2, 12), window.innerWidth - width - 12);
      const top = Math.max(rect.top - callout.offsetHeight - 10, 12);
      callout.style.left = `${left}px`;
      callout.style.top = `${top}px`;
    }

    function showToast(text) {
      const phone = document.querySelector(".phone");
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = text;
      phone.appendChild(toast);
      timers.push(setTimeout(() => toast.remove(), 1650));
    }

    function bindActionCards(root = document) {
      root.querySelectorAll(".action-card").forEach((button) => {
        button.addEventListener("click", () => {
          const target = button.dataset.target;
          highlightTarget(target, button.querySelector("strong").textContent);
        });
      });
    }

    function clearTimers() {
      timers.forEach((timer) => clearTimeout(timer));
      timers = [];
      clearHighlights();
      removeTyping();
    }

    function escapeHtml(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    caseList.addEventListener("click", (event) => {
      const button = event.target.closest("[data-case]");
      if (!button) return;
      autoPlay = false;
      autoState.textContent = "手动演示";
      playScenario(Number(button.dataset.case));
    });

    playButton.addEventListener("click", () => {
      autoPlay = true;
      autoState.textContent = "自动播放中";
      playScenario(activeCase);
    });

    replayButton.addEventListener("click", () => {
      playScenario(activeCase);
    });

    document.querySelectorAll(".menu-item").forEach((item) => {
      item.addEventListener("click", () => {
        document.querySelectorAll(".menu-item").forEach((menu) => menu.classList.remove("is-active"));
        item.classList.add("is-active");
        highlightTarget(item.dataset.target, item.textContent.trim());
      });
    });

    renderCases();
    playScenario(0);
  </script>
</body>
</html>
